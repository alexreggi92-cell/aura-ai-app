<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aura AI — Face Swap Dessert Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0b0d11;
      color: #f3f4f6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 80px;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: rgba(11, 13, 17, 0.9);
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 800;
      font-size: 1.2rem;
      color: #fff;
    }

    .logo-area span {
      color: #34d399;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-tariff, .btn-login {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }

    main {
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
    }

    /* Блок загрузки Вашего Фото */
    .user-face-upload {
      background: linear-gradient(135deg, rgba(52, 211, 153, 0.15), rgba(16, 185, 129, 0.05));
      border: 1px dashed rgba(52, 211, 153, 0.4);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .upload-info h4 {
      font-size: 0.9rem;
      color: #fff;
      margin-bottom: 4px;
    }

    .upload-info p {
      font-size: 0.75rem;
      color: #9ca3af;
    }

    .btn-upload-face {
      background: #34d399;
      color: #0b0d11;
      border: none;
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    /* Сетка трендов / фотосетов */
    .section-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: #9ca3af;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .grid-trends {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .trend-card {
      position: relative;
      height: 220px;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background-size: cover;
      background-position: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
    }

    .trend-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.85) 100%);
    }

    .badge-hit {
      position: relative;
      z-index: 2;
      align-self: flex-start;
      background: #f59e0b;
      color: #000;
      font-weight: 800;
      font-size: 0.65rem;
      padding: 3px 8px;
      border-radius: 8px;
    }

    .trend-info {
      position: relative;
      z-index: 2;
    }

    .trend-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 4px;
    }

    .trend-subtitle {
      font-size: 0.7rem;
      color: #d1d5db;
    }

    /* Bottom Nav */
    nav.bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: rgba(13, 15, 20, 0.95);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: #6b7280;
      text-decoration: none;
      font-size: 0.65rem;
      font-weight: 600;
    }

    .nav-item.active {
      color: #fff;
    }

    .nav-center-btn {
      width: 48px;
      height: 48px;
      background: #34d399;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0b0d11;
      font-size: 1.3rem;
      font-weight: 800;
      box-shadow: 0 4px 15px rgba(52, 211, 153, 0.4);
      margin-top: -16px;
    }

    /* Fullscreen Story/Trend Modal (как на 3 скриншоте) */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: #0b0d11;
      z-index: 300;
      flex-direction: column;
      justify-content: flex-end;
      padding: 20px;
    }

    .modal-preview-box {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0.6;
    }

    .modal-body {
      position: relative;
      z-index: 10;
      background: rgba(18, 21, 28, 0.9);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 20px;
    }

    .modal-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 6px;
    }

    .modal-desc {
      font-size: 0.8rem;
      color: #9ca3af;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .btn-repeat {
      width: 100%;
      background: #34d399;
      color: #0b0d11;
      border: none;
      padding: 14px;
      border-radius: 16px;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(52, 211, 153, 0.3);
    }

    .btn-close-modal {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 20;
      background: rgba(0,0,0,0.5);
      color: #fff;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-area">
      ✨ Aura <span>AI</span>
    </div>
    <div class="header-right">
      <button class="btn-tariff">Тарифы</button>
      <button class="btn-login">Войти</button>
    </div>
  </header>

  <main>
    <!-- Загрузка лица -->
    <div class="user-face-upload">
      <div class="upload-info">
        <h4 id="face-status">👤 Загрузите ваше фото</h4>
        <p>Для подстановки вашего лица (99% сходство)</p>
      </div>
      <button class="btn-upload-face" onclick="document.getElementById('face-input').click()">Загрузить</button>
      <input type="file" id="face-input" accept="image/*" style="display:none" onchange="onFaceUploaded(event)">
    </div>

    <div class="section-title">Тренды и Десертные Фотосеты</div>

    <!-- Сетка карточек как на 2 скриншоте -->
    <div class="grid-section grid-trends">
      <div class="trend-card" style="background-image: url('https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=400');" onclick="openModal('Эффектный дрифт с тортом', 'Машина уходит в дрифт и идеально подъезжает, чтобы задуть свечи на торте с вашим лицом.', 'https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=800')">
        <span class="badge-hit">ХИТ</span>
        <div class="trend-info">
          <div class="trend-title">Дрифт с тортом</div>
          <div class="trend-subtitle">День рождения / Авто</div>
        </div>
      </div>

      <div class="trend-card" style="background-image: url('https://images.unsplash.com/photo-1587314168485-3236d6710814?w=400');" onclick="openModal('Неоновый кондитер', 'Вы в стильном неоновом свете создаете гигантский муссовый десерт.', 'https://images.unsplash.com/photo-1587314168485-3236d6710814?w=800')">
        <div class="trend-info">
          <div class="trend-title">Неон & Мусс</div>
          <div class="trend-subtitle">Cyberpunk Dessert</div>
        </div>
      </div>

      <div class="trend-card" style="background-image: url('https://images.unsplash.com/photo-1606313564200-e75d5e30476c?w=400');" onclick="openModal('Шоколадный взрыв', 'Эпичная съемка: вы на фоне взрывающегося шоколадного фондана.', 'https://images.unsplash.com/photo-1606313564200-e75d5e30476c?w=800')">
        <div class="trend-info">
          <div class="trend-title">Шоко-Взрыв</div>
          <div class="trend-subtitle">Тренды 2026</div>
        </div>
      </div>

      <div class="trend-card" style="background-image: url('https://images.unsplash.com/photo-1509440159596-0249088772ff?w=400');" onclick="openModal('Парижский макарон', 'Вы в уютной парижской кофейне с набором авторских макаронс.', 'https://images.unsplash.com/photo-1509440159596-0249088772ff?w=800')">
        <div class="trend-info">
          <div class="trend-title">Парижский стиль</div>
          <div class="trend-subtitle">Эстетика</div>
        </div>
      </div>
    </div>
  </main>

  <!-- Модалка (как на 3 скриншоте) -->
  <div class="modal" id="modal">
    <button class="btn-close-modal" onclick="closeModal()">✕</button>
    <div class="modal-preview-box" id="modal-bg"></div>
    <div class="modal-body">
      <div class="modal-title" id="modal-title">Название тренда</div>
      <div class="modal-desc" id="modal-desc">Описание тренда...</div>
      <button class="btn-repeat" onclick="runFaceSwap()">Повторить с моим лицом</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="#" class="nav-item active">🏠<span>Главная</span></a>
    <a href="#" class="nav-item">📋<span>Промпты</span></a>
    <div class="nav-center-btn">✦</div>
    <a href="#" class="nav-item">⏱️<span>История</span></a>
    <a href="#" class="nav-item">👤<span>Профиль</span></a>
  </nav>

  <script>
    let hasUserPhoto = false;

    function onFaceUploaded(e) {
      if(e.target.files && e.target.files[0]) {
        hasUserPhoto = true;
        document.getElementById('face-status').innerText = '✅ Фото лица загружено!';
      }
    }

    function openModal(title, desc, bgUrl) {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-desc').innerText = desc;
      document.getElementById('modal-bg').style.backgroundImage = `url('${bgUrl}')`;
      document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }

    function runFaceSwap() {
      if(!hasUserPhoto) {
        alert('Пожалуйста, сначала загрузите ваше фото с лицом вверху страницы!');
        return;
      }
      alert('🚀 Запрос отправлен! Подключаем Face Swap API для замены лица...');
    }
  </script>
</body>
</html>
