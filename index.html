<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura AI — Генератор десертов</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0b0d11;
      color: #f3f4f6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header в стиле Lexy GPT */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(16px);
      background: rgba(11, 13, 17, 0.8);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 1.15rem;
      color: #fff;
      text-decoration: none;
      letter-spacing: -0.3px;
    }

    .logo-badge {
      background: linear-gradient(135deg, #ff4d4d, #f97316);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .balance-badge {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-buy {
      background: linear-gradient(135deg, #ff4d4d, #f97316);
      color: #fff;
      border: none;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 77, 77, 0.25);
      white-space: nowrap;
      transition: transform 0.15s ease;
    }

    .btn-buy:active {
      transform: scale(0.95);
    }

    /* Main Container */
    main {
      flex: 1;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 16px 40px;
      display: flex;
      flex-direction: column;
    }

    .hero-badge {
      align-self: center;
      background: rgba(255, 77, 77, 0.1);
      border: 1px solid rgba(255, 77, 77, 0.2);
      color: #ff6b6b;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 800;
      text-align: center;
      line-height: 1.25;
      margin-bottom: 10px;
      background: linear-gradient(180deg, #ffffff 0%, #a1a1aa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 0.88rem;
      color: #9ca3af;
      text-align: center;
      line-height: 1.45;
      margin-bottom: 20px;
    }

    /* Presets (Lexy style) */
    .presets-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .presets-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      scrollbar-width: none;
    }

    .presets-scroll::-webkit-scrollbar {
      display: none;
    }

    .preset-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #d1d5db;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .preset-card:hover, .preset-card:active {
      background: rgba(255, 77, 77, 0.12);
      border-color: rgba(255, 77, 77, 0.3);
      color: #fff;
    }

    /* App Card */
    .card {
      background: rgba(18, 21, 28, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(12px);
      margin-bottom: 20px;
    }

    .input-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #e5e7eb;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      height: 100px;
      background: #0b0d11;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 12px;
      color: #fff;
      font-size: 0.9rem;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: #ff4d4d;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
      gap: 10px;
    }

    .cost-text {
      font-size: 0.75rem;
      color: #6b7280;
    }

    .btn-generate {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #fff;
      border: none;
      padding: 11px 18px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 16px rgba(34, 197, 94, 0.25);
      transition: transform 0.15s ease;
    }

    .btn-generate:active {
      transform: scale(0.96);
    }

    /* Output Box */
    .result-container {
      background: rgba(18, 21, 28, 0.4);
      border: 1px dashed rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 24px 16px;
      text-align: center;
      color: #6b7280;
      font-size: 0.85rem;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <header>
    <a href="#" class="logo">
      🍓 Aura AI <span class="logo-badge">PRO</span>
    </a>
    <div class="header-actions">
      <div class="balance-badge">🪙 <span id="balance-count">10</span></div>
      <button class="btn-buy">Пополнить</button>
    </div>
  </header>

  <main>
    <div class="hero-badge">AI Dessert Studio</div>
    <h1>Генератор авторских десертов</h1>
    <p class="subtitle">Создавайте концепты тортов, пирожных и фуд-фото за пару кликов.</p>

    <div class="presets-label">Готовые пресеты десертов</div>
    <div class="presets-scroll">
      <div class="preset-card" onclick="applyPreset('Муссовый пирожное-сердце с велюровым покрытием и зеркальной глазурью, ягоды малины, фуд-съемка')">🍰 Муссовый торт</div>
      <div class="preset-card" onclick="applyPreset('Шоколадный фондан с вытекающим ганашем и шариком ванильного мороженого, темный фон')">🍫 Шоколадный фондан</div>
      <div class="preset-card" onclick="applyPreset('Авторский капкейк с пышной кремовой шапочкой, съедобным золотом и свежей черникой')">🧁 Неоновый капкейк</div>
      <div class="preset-card" onclick="applyPreset('Макаронс миндальный с фисташковым кремом на мраморном столике, мягкий свет')">🍡 Фисташковый макарон</div>
    </div>

    <div class="card">
      <label class="input-label" for="prompt">Промпт для генерации</label>
      <textarea id="prompt" placeholder="Опишите десерт или нажмите на пресет выше..."></textarea>
      
      <div class="card-footer">
        <span class="cost-text">Стоимость: 1 кредит</span>
        <button class="btn-generate" onclick="startGeneration()">
          ✨ Сгенерировать
        </button>
      </div>
    </div>

    <div class="result-container" id="result-box">
      Результат генерации отобразится здесь
    </div>
  </main>

  <script>
    let balance = 10;

    function applyPreset(text) {
      document.getElementById('prompt').value = text;
    }

    function startGeneration() {
      const promptInput = document.getElementById('prompt').value;
      const resultBox = document.getElementById('result-box');

      if (!promptInput.trim()) {
        alert('Пожалуйста, введите описание десерта или выберите пресет!');
        return;
      }

      if (balance <= 0) {
        alert('У вас закончились кредиты! Пополните баланс.');
        return;
      }

      // Списание баланса
      balance -= 1;
      document.getElementById('balance-count').innerText = balance;

      resultBox.innerHTML = `
        <div style="color: #ff4d4d; font-weight: 700; margin-bottom: 6px;">⏳ ИИ создает ваш десерт...</div>
        <div style="font-size: 0.75rem; color: #9ca3af; max-width: 90%;">"${promptInput}"</div>
      `;

      setTimeout(() => {
        resultBox.innerHTML = `
          <div style="color: #4ade80; font-weight: 700; margin-bottom: 6px;">✅ Десерт сгенерирован!</div>
          <div style="font-size: 0.8rem; color: #d1d5db;">(Здесь будет отображаться готовое фото десерта)</div>
        `;
      }, 2000);
    }
  </script>

</body>
</html>
